# Ao enviar uma tag de versão (por exemplo, v1.2), gera o pacote do Windows e publica a Release.
#   git tag v1.2
#   git push origin v1.2
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # necessário para criar a Release e anexar o pacote

jobs:
  windows:
    name: Pacote para Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testes antes de empacotar
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install sdl2:x64-windows
          cmake -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure
      - name: Empacotar (executável único, sem DLLs)
        shell: cmd
        run: empacotar.bat "%VCPKG_INSTALLATION_ROOT%"
      - name: Publicar a Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NiGBA-windows.zip
          generate_release_notes: true
      - name: Guardar o pacote (execução manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: NiGBA-windows
          path: dist/NiGBA-windows.zip
